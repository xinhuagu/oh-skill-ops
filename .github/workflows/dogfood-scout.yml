name: Dogfood Scout

"on":
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dogfood-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    env:
      HAS_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Skip scheduled no-key run
        if: github.event_name != 'workflow_dispatch' && env.HAS_CLAUDE_CODE_OAUTH_TOKEN != 'true'
        run: echo "Scheduled no-key run skipped. Use workflow_dispatch for deterministic fallback dogfooding."

      - name: Run no-key manual dogfood scout
        if: github.event_name == 'workflow_dispatch' && env.HAS_CLAUDE_CODE_OAUTH_TOKEN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Dogfood Scout: ${GITHUB_RUN_ID}"
          body_file="${RUNNER_TEMP}/dogfood-scout-body.md"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          cat > "${body_file}" <<EOF
          Dogfood observation:
          Manual dogfood now runs without Claude Code OAuth credentials. The deterministic fallback found that Oh SkillOps still lacks the first local executable CLI gate: skillops lint.

          Evidence:
          - This workflow was manually dispatched without CLAUDE_CODE_OAUTH_TOKEN and reached the no-key fallback path: ${run_url}
          - ROADMAP.md lists skillops lint, score, and audit as Milestone 1 deliverables.
          - docs/dogfooding.md still lists no skillops lint, score, or audit implementation as current gaps.

          Relevant managed skill:
          - skills/project-incubation/thesis-capture/
          - docs/scheduled-dogfood-maintainer.md

          Proposed repository artifact:
          Add the first deterministic local CLI gate, starting with skillops lint for package structure, skillops.yaml schema validation, referenced eval files, and lifecycle fields.

          Risk and scope:
          Low. This fallback created an issue only. It did not edit repository files, create branches, open pull requests, change secrets, or change workflow permissions.

          Suggested gates:
          - Keep the first CLI implementation local-first and deterministic.
          - Validate it against skills/project-incubation/thesis-capture and examples/good/repo-change-review.
          - Do not introduce optimizer behavior or external service dependencies in the first lint pass.

          Smallest next commit:
          Add a minimal skillops lint scaffold that validates skillops.yaml against schemas/skillops.schema.json and checks that declared skill_file and eval paths exist.
          EOF

          labels=()
          for label in dogfood automation needs-human-review; do
            if gh label list --repo "${GITHUB_REPOSITORY}" --search "${label}" --json name --jq '.[].name' | grep -Fxq "${label}"; then
              labels+=(--label "${label}")
            fi
          done

          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${title}" \
            --body-file "${body_file}" \
            "${labels[@]}"

      - name: Run scheduled dogfood scout
        if: env.HAS_CLAUDE_CODE_OAUTH_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            RUN MODE: scheduled dogfood scout

            You are running the Oh SkillOps scheduled dogfood scout.

            Load and use these repository files as the governing context:
            - README.md
            - ROADMAP.md
            - docs/dogfooding.md
            - docs/dogfood-loop.md
            - docs/scheduled-dogfood-maintainer.md
            - docs/implementation-architecture.md
            - skills/project-incubation/thesis-capture/SKILL.md
            - skills/project-incubation/thesis-capture/skillops.yaml
            - skills/project-incubation/thesis-capture/evals/trigger.yaml
            - skills/project-incubation/thesis-capture/evals/output.yaml
            - skills/project-incubation/thesis-capture/memory/accepted-lessons.md
            - skills/project-incubation/thesis-capture/memory/rejected-edits.md

            Task:
            1. Inspect the repository for one concrete gap where Oh SkillOps is not yet dogfooding its own Skill-as-Code, Self-improving Skills, or Skill Standards thesis.
            2. Prefer gaps that can become a small reviewable commit.
            3. Create or update one GitHub issue titled "Dogfood Scout: ${{ github.run_id }}".
            4. Use this issue body shape:

               Dogfood observation:
               Evidence:
               Relevant managed skill:
               Proposed repository artifact:
               Risk and scope:
               Suggested gates:
               Smallest next commit:

            Hard constraints:
            - Do not edit repository files.
            - Do not create branches, commits, pull requests, releases, tags, or deployments.
            - Do not change secrets, workflow permissions, branch protection, or repository settings.
            - Do not propose self-merge.
            - Do not broaden the project into a marketplace, hosted platform, or optimizer-first tool.
            - If labels such as dogfood, automation, or needs-human-review exist, use them. If they do not exist, create the issue without labels.

            Success means a human maintainer can review the issue and decide whether to approve a later builder workflow.
          claude_args: |
            --max-turns 8
            --allowedTools "Read,Glob,Grep,Bash(gh issue:*),Bash(git status:*),Bash(git log:*),Bash(git diff:*)"
